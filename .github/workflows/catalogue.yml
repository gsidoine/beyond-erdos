name: Catalogue consistency
on:
  pull_request:
  push:
    branches: [main]
jobs:
  catalogue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate generated catalogue
        run: python scripts/generate_catalog.py --check
      - name: Validate problem metadata
        run: python -m unittest discover -s tests -v
